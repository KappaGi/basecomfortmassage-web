        const isEN = userLang.toLowerCase().startsWith('en');

        // Redirigir (por defecto a NL) - usando rutas relativas para funcionar en local
        window.location.href = isEN ? 'en/index.html' : 'nl/index.html';
    </script>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            display: flex;

            background-color: #F5EBDD;
            color: #5a5a4a;
        }
        .container {
            text-align: center;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            margin: 0 10px;
            color: #A2A37E;
            text-decoration: none;
            font-weight: 600;
        }
        .links a:hover {
            color: #C89C6C;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Redirecting... / Doorverwijzen...</p>
        <div class="links">
            <a href="en/index.html">English</a> | <a href="nl/index.html">Nederlands</a>
        </div>
    </div>

</html>
